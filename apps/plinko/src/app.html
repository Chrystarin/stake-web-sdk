		<!-- `maximum-scale`/`user-scalable` stop pinch- and double-tap-zoom on Android; iOS Safari has
		     ignored both since iOS 10, so the actual double-tap fix there is `touch-action` on <body>. -->
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
		/>
		%sveltekit.head%
	</head>
	<!-- `touch-action: manipulation` kills the double-tap-to-zoom gesture (and its 300 ms click delay)
	     while leaving pan and pinch-zoom intact. The two Play buttons narrow this further to
	     `touch-action: none` (GameHud.scss) so bonus hold-to-drop isn't interrupted by a pan. -->
	<body
		style="margin: 0; padding: 0; overflow: hidden; touch-action: manipulation; background-color: #0a0f14"
	>
		<div>%sveltekit.body%</div>
	</body>
